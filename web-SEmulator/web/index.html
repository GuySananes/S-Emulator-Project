<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Emulator - Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="page-login">
<div class="container-center">
    <div class="card login-card">
        <!-- Header Section -->
        <div class="login-header">
            <h1 class="app-title">S-Emulator</h1>
            <p class="subtitle">Welcome to S-Emulator System</p>
        </div>

        <!-- Login Status (Hidden by default) -->
        <div id="loginStatus" class="login-status hidden">
            <div class="status-item">
                <span class="status-label">Logged in as:</span>
                <strong id="currentUser" class="status-value"></strong>
            </div>
            <div class="status-item">
                <span class="status-label">Credits:</span>
                <strong id="userCredits" class="status-value badge badge-credits"></strong>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                >
            </div>

            <div id="loginError" class="error-message hidden"></div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-full-width">
                Login
            </button>
        </form>

        <!-- Live Users Section -->
        <div class="live-users-section">
            <h3 class="section-title">
                <span class="title-icon">👥</span>
                Live Users
            </h3>
            <div id="usersTableContainer" class="table-container">
                <div class="empty-state">Loading users...</div>
            </div>
            <p class="text-muted text-center">
                Last updated: <span id="lastUpdated">Never</span>
            </p>
        </div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script type="module" src="js/login.js"></script>
</body>
</html>
